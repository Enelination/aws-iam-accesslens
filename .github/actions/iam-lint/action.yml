name: "IAM Policy Linter"
description: "Analyze AWS IAM policies for security risks and post findings as a PR comment"
branding:
  icon: "shield"
  color: "red"
inputs:
  policy-files:
    description: "Glob pattern for IAM policy files (space-separated)"
    required: false
    default: "**/*.json"
  fail-on-danger:
    description: "Fail the check if any HIGH RISK findings exist"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - shell: bash
      run: |
        npm install -g aws-iam-accesslens
    - shell: bash
      id: analyze
      env:
        POLICY_FILES: ${{ inputs.policy-files }}
        FAIL_ON_DANGER: ${{ inputs.fail-on-danger }}
      run: |
        echo "# IAM Policy Security Report" > /tmp/report.md
        echo "" >> /tmp/report.md

        TOTAL_SCORE=100
        HAS_DANGER=false
        FOUND_FILES=false

        for f in $(eval find . -name "$POLICY_FILES" -not -path "*/node_modules/*" -not -path "*/.git/*"); do
          FOUND_FILES=true
          echo "Analyzing: $f"
          RESULT=$(iam-accesslens "$f" --json 2>/dev/null)
          if [ $? -ne 0 ]; then
            echo "## ⚠️ $f" >> /tmp/report.md
            echo "" >> /tmp/report.md
            echo "Invalid JSON — could not parse." >> /tmp/report.md
            echo "" >> /tmp/report.md
            continue
          fi

          SCORE=$(echo "$RESULT" | jq -r '.score')
          GRADE=$(echo "$RESULT" | jq -r '.grade')
          DANGER=$(echo "$RESULT" | jq -r '.totalDanger')
          WARN=$(echo "$RESULT" | jq -r '.totalWarn')
          SAFE=$(echo "$RESULT" | jq -r '.totalSafe')

          if [ "$DANGER" -gt 0 ]; then HAS_DANGER=true; fi
          if [ "$SCORE" -lt "$TOTAL_SCORE" ]; then TOTAL_SCORE=$SCORE; fi

          if [ "$DANGER" -gt 0 ]; then
            ICON="🔴"
          elif [ "$WARN" -gt 0 ]; then
            ICON="🟡"
          else
            ICON="🟢"
          fi

          echo "## $ICON \`$f\` — Score: $SCORE/100 (Grade $GRADE)" >> /tmp/report.md
          echo "" >> /tmp/report.md

          echo "$RESULT" | jq -r '.statements[] | "### Statement: \(.sid)\n**Effect:** \(.effect) | **Risk:** \(.worstLevel)\n\n> \(.summary)\n"' >> /tmp/report.md

          echo "$RESULT" | jq -r '.statements[].findings[] | "- \(.level | if . == "danger" then "🔴" elif . == "warn" then "🟡" else "🟢" end) \(.msg)"' >> /tmp/report.md
          echo "" >> /tmp/report.md
          echo "---" >> /tmp/report.md
          echo "" >> /tmp/report.md
        done

        if [ "$FOUND_FILES" = false ]; then
          echo "No policy files found matching \`$POLICY_FILES\`" >> /tmp/report.md
        fi

        echo "score=$TOTAL_SCORE" >> "$GITHUB_OUTPUT"
        echo "has_danger=$HAS_DANGER" >> "$GITHUB_OUTPUT"
    - uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('/tmp/report.md', 'utf8');
          const score = '${{ steps.analyze.outputs.score }}';
          const hasDanger = '${{ steps.analyze.outputs.has_danger }}';

          const body = `## 🛡️ IAM Policy Linter\n\n${report}\n\n<details><summary>Generated by <a href="https://github.com/Enelination/aws-iam-accesslens">IAM Visualizer</a></summary>\n\nScore: ${score}/100\n</details>`;

          // Find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes('🛡️ IAM Policy Linter'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
    - name: Fail on danger
      if: steps.analyze.outputs.has_danger == 'true' && inputs.fail-on-danger == 'true'
      run: |
        echo "::error::IAM policy contains HIGH RISK findings. Score: ${{ steps.analyze.outputs.score }}/100"
        exit 1
