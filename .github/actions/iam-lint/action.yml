name: "IAM Policy Linter"
description: "Analyze AWS IAM policies for security risks and post findings as a PR comment"
branding:
  icon: "shield"
  color: "red"
inputs:
  policy-files:
    description: "Glob pattern for IAM policy files (space-separated)"
    required: false
    default: "**/*.json"
  fail-on-danger:
    description: "Fail the check if any HIGH RISK findings exist"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - shell: bash
      run: |
        npm install -g aws-iam-accesslens
    - shell: bash
      id: analyze
      env:
        POLICY_FILES: ${{ inputs.policy-files }}
        FAIL_ON_DANGER: ${{ inputs.fail-on-danger }}
      run: |
        echo "# IAM Policy Security Report" > /tmp/report.md
        echo "" >> /tmp/report.md

        TOTAL_SCORE=100
        HAS_DANGER=false
        FOUND_FILES=false

        # Sanitize: only allow safe glob characters
        SAFE_PATTERN=$(echo "$POLICY_FILES" | sed 's/[^a-zA-Z0-9.*?_\-\//]//g')

        while IFS= read -r f; do
          FOUND_FILES=true
          echo "Analyzing: $f"
          RESULT=$(iam-accesslens "$f" --json 2>/dev/null)
          if [ $? -ne 0 ]; then
            echo "## ⚠️ $f" >> /tmp/report.md
            echo "" >> /tmp/report.md
            echo "Invalid JSON — could not parse." >> /tmp/report.md
            echo "" >> /tmp/report.md
            continue
          fi

          SCORE=$(echo "$RESULT" | jq -r '.score')
          GRADE=$(echo "$RESULT" | jq -r '.grade')
          DANGER=$(echo "$RESULT" | jq -r '.totalDanger')
          WARN=$(echo "$RESULT" | jq -r '.totalWarn')
          SAFE=$(echo "$RESULT" | jq -r '.totalSafe')

          if [ "$DANGER" -gt 0 ]; then HAS_DANGER=true; fi
          if [ "$SCORE" -lt "$TOTAL_SCORE" ]; then TOTAL_SCORE=$SCORE; fi

          if [ "$DANGER" -gt 0 ]; then
            ICON="🔴"
          elif [ "$WARN" -gt 0 ]; then
            ICON="🟡"
          else
            ICON="🟢"
          fi

          # Use jq to safely build the markdown (avoids shell injection from filenames)
          echo "$RESULT" | jq -r --arg file "$f" --arg icon "$ICON" --arg score "$SCORE" --arg grade "$GRADE" '
            "## \($icon) `\($file)` — Score: \($score)/100 (Grade \($grade))\n" +
            (.statements[] | "### Statement: \(.sid)\n**Effect:** \(.effect) | **Risk:** \(.worstLevel)\n\n> \(.summary)\n" +
            (.findings[] | "- \(if .level == "danger" then "🔴" elif .level == "warn" then "🟡" else "🟢" end) \(.msg)") +
            "\n---\n")
          ' >> /tmp/report.md
        done < <(find . -type f -name "$SAFE_PATTERN" -not -path "*/node_modules/*" -not -path "*/.git/*")

        if [ "$FOUND_FILES" = false ]; then
          echo "No policy files found matching \`$SAFE_PATTERN\`" >> /tmp/report.md
        fi

        echo "score=$TOTAL_SCORE" >> "$GITHUB_OUTPUT"
        echo "has_danger=$HAS_DANGER" >> "$GITHUB_OUTPUT"
    - uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('/tmp/report.md', 'utf8');
          const score = parseInt('${{ steps.analyze.outputs.score }}', 10) || 0;
          const hasDanger = '${{ steps.analyze.outputs.has_danger }}' === 'true';

          const body = `## 🛡️ IAM Policy Linter\n\n${report}\n\n<details><summary>Generated by <a href="https://github.com/Enelination/aws-iam-accesslens">IAM Visualizer</a></summary>\n\nScore: ${score}/100\n</details>`;

          // Find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes('🛡️ IAM Policy Linter'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
    - name: Fail on danger
      if: steps.analyze.outputs.has_danger == 'true' && inputs.fail-on-danger == 'true'
      run: |
        echo "::error::IAM policy contains HIGH RISK findings. Score: ${{ steps.analyze.outputs.score }}/100"
        exit 1
